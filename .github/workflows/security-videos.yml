name: C security video examples
on:
  pull_request:
    paths:
      - 'security-videos/**'
      - '.github/workflows/security-videos.yml'
  push:
    paths:
      - 'security-videos/**'
      - '.github/workflows/security-videos.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test security video examples
        run: make -C security-videos test
